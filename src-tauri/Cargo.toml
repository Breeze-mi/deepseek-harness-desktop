[package]
name = "deepseek-harness-desktop"
version = "0.2.0"
description = "DeepSeek Harness 桌面版"
authors = ["Breeze-mi"]
edition = "2021"

[lib]
# `_lib` 后缀在 Windows 上必需，避免与 bin 名冲突
# @see https://github.com/rust-lang/cargo/issues/8519
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"

# 引导流程：下载便携 Node、校验、解压
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = "2"
# Node 版本闸门必须精确匹配 `^22.19.0 || >=24.0.0`，手写字符串比较迟早出错
semver = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "net"] }

[target.'cfg(windows)'.dependencies]
# Job Object：保证主进程被强杀时 dsh 子进程一并终止，不留孤儿。
# CreateJobObjectW 的签名带 SECURITY_ATTRIBUTES，所以 Win32_Security 是必需的。
# WindowsAndMessaging 用于 FlashWindowEx（任务栏闪烁）。
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
